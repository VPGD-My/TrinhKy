name: Weekly Snapshot Records

on:
  schedule:
    - cron: '0 21 * * 0'      # 21:00 UTC Chủ nhật = 4h sáng thứ 2 giờ VN (snapshot tuần)
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Chạy snapshot toàn bộ?'
        required: false
        default: 'true'

jobs:
  trigger-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Xác định loại backup
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "snapshot=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.snapshot }}" = "true" ]; then
            echo "snapshot=true" >> $GITHUB_OUTPUT
          else
            echo "snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Call backup-records Edge Function
        run: |
          curl -X POST \
            "https://uujkzjoaxkndkpendiej.supabase.co/functions/v1/backup-records" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"snapshot": ${{ steps.check.outputs.snapshot }}}'
